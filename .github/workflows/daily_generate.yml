name: Velocity Japanese - Daily Auto Video & Publisher

on:
  schedule:
    - cron: '0 6 * * *'  # Runs daily at 06:00 UTC (15:00 JST Tokyo time)
  workflow_dispatch:     # Allows manual 1-click trigger in GitHub Actions UI

permissions:
  contents: write

jobs:
  daily-generate-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-dejavu-core fonts-liberation
          sudo fc-cache -fv

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate & Publish Daily Japanese Short
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY || 'sk_K98O2j1UlpALX9TBAoAuEdqxL1hpB7zh' }}
          AI_MODEL: ${{ secrets.AI_MODEL || 'openai' }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID || '1048385991689324' }}
        run: |
          python main.py --auto --publish

      - name: Commit and Push History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated daily lesson history update [skip ci]" && git push origin master)

      - name: Upload Video Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: velocity-japanese-${{ github.run_number }}
          path: |
            output/*/VelocityJapanese_Short.mp4
            output/*/thumbnail.jpg
            output/*/description.txt
            output/*/metadata.json
          retention-days: 14
